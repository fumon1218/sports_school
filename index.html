<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#cfeaff">
<title>스포츠 마을</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="title">
<canvas id="world" aria-label="학교 광장 3D 화면"></canvas>

<!-- 위쪽 안내 -->
<header id="hud">
  <div id="guide"><p id="guide-text" aria-live="polite"></p></div>
  <div id="hud-right">
    <canvas id="minimap" width="300" height="200" aria-label="미니맵"></canvas>
    <div class="hud-btns"><button id="home" type="button" aria-label="처음 화면으로">🏠</button><button id="gear" type="button" aria-label="설정">⚙</button></div>
  </div>
</header>

<!-- 조작: 방향 버튼 하나 + 행동 버튼 하나 -->
<div id="controls">
  <div id="pad" role="application" aria-label="방향 버튼"><div id="knob"></div><i class="a up">▲</i><i class="a dn">▼</i><i class="a lf">◀</i><i class="a rt">▶</i></div>
  <button id="act" type="button" data-label=""><span>👣</span><b>안내</b><em id="dwell"></em></button>
</div>

<!-- 설정 -->
<section id="settings" hidden>
  <h2>설정</h2>
  <label><input type="checkbox" id="opt-easy"> 쉬운 모드 <small>천천히 걷고, 입구에 서 있으면 자동으로 들어가요</small></label>
  <label><input type="checkbox" id="opt-calm"> 움직임 줄이기</label>
  <button id="settings-close" type="button">닫기</button>
</section>

<!-- 시작 화면 -->
<section id="title">
  <div class="t-wrap">
    <div class="t-brand">
      <span class="t-chip">체육 중점 스포츠 마을</span>
      <h1 id="title-h"></h1>
      <p id="title-sub"></p>
      <div class="t-icons" aria-hidden="true"><img src="assets/ui/icon_swimming.webp" alt=""><img src="assets/ui/icon_athletics.webp" alt=""><img src="assets/ui/icon_tabletennis.webp" alt=""><img src="assets/ui/icon_badminton.webp" alt=""><img src="assets/ui/icon_taekwondo.webp" alt=""><img src="assets/ui/icon_tennis.webp" alt=""><img src="assets/ui/icon_judo.webp" alt=""></div>
    </div>
    <div class="t-panel">
      <div class="t-label">함께 걸을 친구를 골라요</div>
      <div class="avatars" role="group" aria-label="캐릭터 고르기">
        <button type="button" class="avatar" data-k="boy"><img src="assets/ui/av_boy.webp" alt=""><b>남학생</b></button>
        <button type="button" class="avatar" data-k="girl"><img src="assets/ui/av_girl.webp" alt=""><b>여학생</b></button>
        <button type="button" class="avatar" data-k="squirrel"><img src="assets/ui/av_squirrel.webp" alt=""><b>다람쥐</b></button>
      </div>
      <label class="t-toggle"><input type="checkbox" id="t-easy"><span><b>쉬운 모드</b><small>천천히 걷고, 입구에 서 있으면 자동으로 들어가요</small></span></label>
      <button id="start" type="button">시작하기 <i>▶</i></button>
      <button type="button" id="open-info" class="ghost">학교 소개 보기</button>
      <small class="t-help">컴퓨터는 방향키와 스페이스, 태블릿·휴대폰은 화면 버튼으로 해요.</small>
    </div>
  </div>
</section>

<!-- 체육관 로비 -->
<section id="lobby" hidden>
  <div class="lobby-top">
    <button id="lobby-back" type="button">← 광장으로</button>
    <h2>체육관 로비</h2>
    <button type="button" class="home-btn" data-home>🏠 처음으로</button><div class="medals"><span id="medal-row"></span><b id="medal-count"></b></div>
  </div>
  <div id="sports" role="list"></div>
  <p class="lobby-hint">하고 싶은 종목을 눌러요. 틀려도 괜찮아요. 모두 응원해요!</p>
</section>

<!-- 안내관: 학교 소개 · 육성 종목 · 입학 안내 -->
<section id="info" hidden>
  <div class="info-card">
    <div class="info-top"><h2 id="info-title"></h2><button type="button" class="home-btn" data-home>🏠 처음으로</button><button id="info-close" type="button">닫기 ✕</button></div>
    <div class="tabs" role="tablist"><button type="button" data-t="about" class="on">학교 소개</button><button type="button" data-t="sports">육성 종목</button><button type="button" data-t="admission">입학 안내</button></div>
    <div id="info-body"></div>
  </div>
</section>

<!-- 기존 스포츠 게임 -->
<section id="game" hidden>
  <div class="game-top"><button id="game-back" type="button">← 체육관으로</button><b id="game-title"></b><button type="button" class="home-btn" data-home>🏠 처음으로</button></div>
  <iframe id="game-frame" title="스포츠 체험 게임" allow="autoplay" src="about:blank"></iframe>
</section>

<div id="medal-pop" role="status"><img src="assets/ui/medal_gold.webp" alt=""><p></p></div>
<div id="toast" role="status"></div>
<div id="fade"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
