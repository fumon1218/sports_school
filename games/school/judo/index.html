<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>유도복 입기</title><link rel="stylesheet" href="../kit.css"></head><body><script src="../kit.js"></script><script>
// 유도: 도복 입기. 버튼을 한 번 누를 때마다 도복 한 벌씩 입고, 마지막엔 멋지게 경례! 틀리거나 늦는 일이 없어요.
const K = Kit;
const STEPS = [
  { say: '먼저 도복 상의와 띠를 입어요!', label: '상의 입기!', items: ['item_top', 'item_belt'], pose: 'judo_1', done: '도복 상의와 띠 완성!' },
  { say: '이번엔 도복 바지를 입어요!', label: '바지 입기!', items: ['item_pants'], pose: 'judo_3', done: '도복 바지까지 완성!' },
  { say: '다 입었어요! 서로 인사해요', label: '경례!', items: [], pose: 'judo_bow', done: '경례! 멋진 유도 선수예요' }];
let step, t, fly, pose, playing, wearT, bowT, flyT0 = 0;
const ease = (x) => x * x * (3 - 2 * x);
function reset() { step = 0; t = 0; fly = 0; pose = 'judo_0'; playing = true; wearT = 0; bowT = 0; K.say(STEPS[0].say); K.label(STEPS[0].label); K.hud('0 / 3'); }
K.onPress(() => {
  if (!playing || fly > 0) return;
  const S = STEPS[step]; fly = 1; flyT0 = t; wearT = 0; K.beep(520 + step * 120, 0.12);
  setTimeout(() => { pose = S.pose; wearT = 1; K.good(); K.burst(K.W * 0.34, K.H * 0.5, '#ffd24a', 18); K.say(S.done); K.hud(`${step + 1} / 3`);
    setTimeout(() => {
      step++; fly = 0;
      if (step >= STEPS.length) { playing = false; setTimeout(() => K.finish('멋진 유도복! 참 잘했어요', '도복을 모두 입고 경례까지 했어요!', 3, reset), 1000); }
      else { K.say(STEPS[step].say); K.label(STEPS[step].label); }
    }, 900);
  }, 650);
});
function update(dt) { t += dt; wearT = Math.max(0, wearT - dt * 2); }
function draw(c, W, H) {
  const gy = H * 0.7, s = Math.min(H, W) * 0.2; K.sky(gy, '#f8f1e2', '#fff9ee');
  c.fillStyle = '#ece0c6'; c.fillRect(0, 0, W, gy * 0.9); c.fillStyle = '#c9b78d'; for (let x = 0; x < W; x += 140) c.fillRect(x, 0, 5, gy * 0.9); K.text('柔道', W / 2, H * 0.14, Math.min(H, W) * 0.12, '#c9b78d');
  const cols = ['#8ec26f', '#7bb35f']; for (let i = 0; i < 8; i++) { c.fillStyle = cols[i % 2]; c.beginPath(); c.moveTo(i * W / 8 - 30, gy); c.lineTo((i + 1) * W / 8 - 30, gy); c.lineTo((i + 1) * W / 8 + 10, H); c.lineTo(i * W / 8 + 10, H); c.fill(); }
  c.fillStyle = '#c0392b'; c.fillRect(0, gy, W, 6);
  const hh = s * 2.7, cx = W * 0.36, bob = Math.sin(t * 3) * 3 + wearT * -10;
  K.spr(pose, cx, gy + 24 + bob, hh, { px: 0.51 });
  K.spr('sq', W * 0.8, gy + 26, s * 2.1, { face: -1 });
  // 입을 옷: 위에서 통통 튀며 기다리다가, 버튼을 누르면 몸으로 날아가요
  if (playing && step < STEPS.length) {
    const S = STEPS[step], n = S.items.length, ih = s * 1.25;
    S.items.forEach((nm, i) => {
      const bx = W * 0.64 + (i - (n - 1) / 2) * ih * 1.15, by = H * 0.42 + Math.sin(t * 3 + i) * 8;
      const k = fly > 0 ? Math.min(1, (t - flyT0) / 0.65) : 0;
      const x = bx + (cx - bx) * ease(k), y = by + (H * 0.5 - by) * ease(k), a = fly > 0 ? 1 - ease(k) : 1;
      K.spr(nm, x, y + ih / 2, ih * (1 - 0.35 * k), { px: 0.5, shadow: false, alpha: Math.max(0, a) });
    });
    if (!fly) K.text('▶', W * 0.5, H * 0.42, s * 0.5, '#ff7a2f');
  }
  K.drawParticles(1 / 60);
}
K.start('🥋 유도복 입기', '버튼을 누를 때마다<br>도복을 한 벌씩 입어요.<br>마지막엔 멋지게 경례!', () => { reset(); });
K.run(update, draw);
</script></body></html>
