<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>수영</title><link rel="stylesheet" href="../kit.css"></head><body><script src="../kit.js"></script><script>
let swimF = 0, lastT = 0;
// 수영: 둥근 신호가 작아져 '딱' 맞을 때 버튼을 누르면 힘차게 나아가요. 늦어도 괜찮아요.
const K = Kit, GOAL = K.easy ? 25 : 50, BEAT = K.easy ? 1.3 : 0.95, WIN = K.easy ? 0.42 : 0.26;
let dist, speed, beatT, stroke, perfect, strokes, playing, splash = [], wob = 0, done;
function reset() { dist = 0; speed = 0.8; beatT = 0; stroke = 0; perfect = 0; strokes = 0; done = false; playing = true; K.say('신호가 딱 맞을 때 버튼을 눌러요!'); K.label('저어요!'); }
K.onPress(() => {
  if (!playing) return; const p = beatT / BEAT, d = Math.min(p, 1 - p) * BEAT; // 신호까지 남은/지난 시간
  let boost = 0.7; if (d < WIN * 0.5) { boost = 2.2; perfect++; K.good(); K.say('최고예요! 👍'); } else if (d < WIN) { boost = 1.5; K.beep(600, 0.1); K.say('좋아요!'); } else { K.soft(); K.say('조금 더 기다려 봐요'); }
  speed = Math.min(5.5, speed + boost); stroke = 1; strokes++;
  for (let i = 0; i < 6; i++) splash.push({ x: 0, y: 0, vx: (Math.random() - 0.3) * 120, vy: -Math.random() * 160, l: 0.6 });
});
function update(dt) {
  if (!playing) return; beatT += dt; if (beatT >= BEAT) beatT -= BEAT; wob += dt * (2 + speed * 2);
  speed = Math.max(0.8, speed - dt * 1.1); stroke = Math.max(0, stroke - dt * 3.2); dist += speed * dt;
  K.hud(`${Math.min(GOAL, Math.floor(dist))} / ${GOAL} m`);
  if (dist >= GOAL && !done) { done = true; playing = false; K.say(''); const r = strokes ? perfect / strokes : 0; const st = r > 0.55 ? 3 : r > 0.25 ? 2 : 1; setTimeout(() => K.finish('도착! 참 잘했어요', `${GOAL}m를 헤엄쳤어요!`, st, reset), 700); }
}
function draw(c, W, H) {
  const wl = H * 0.46;
  K.sky(wl, '#7cc8ff', '#eaf8ff');
  // 수영장 건물(멀리): 지붕, 창문, 깃발이 천천히 지나가요
  const off = -(dist * 40) % 360;
  for (let i = -1; i < W / 360 + 2; i++) { const x = i * 360 + off; K.rr(x + 20, wl - 110, 300, 110, 10, '#f4efe6'); K.rr(x + 20, wl - 125, 300, 22, 8, '#6aa6d8'); for (let k = 0; k < 4; k++) K.rr(x + 50 + k * 70, wl - 85, 48, 42, 6, '#bfe3ff'); K.text(['🚩', '🏅', '🌴', '🎈'][((i % 4) + 4) % 4], x + 180, wl - 150, 38); }
  // 물
  const g = c.createLinearGradient(0, wl, 0, H); g.addColorStop(0, '#5fd0ee'); g.addColorStop(1, '#1f8fc9'); c.fillStyle = g; c.fillRect(0, wl, W, H - wl);
  c.strokeStyle = '#ffffff55'; c.lineWidth = 3; for (let k = 0; k < 7; k++) { const y = wl + 14 + k * (H - wl) / 7; c.beginPath(); for (let x = 0; x <= W; x += 20) c.lineTo(x, y + Math.sin(x * 0.03 + K.t * 2 + k) * 4); c.stroke(); }
  // 레인 줄(부표)
  const ly = wl + 46; for (let x = -60; x < W + 60; x += 46) { const xx = x + ((-dist * 140) % 46); K.circle(xx, ly + Math.sin(K.t * 3 + x) * 2, 11, ((x / 46) | 0) % 2 ? '#ff6b6b' : '#fff'); }
  // 도착 벽
  const toGoal = GOAL - dist; if (toGoal < 12) { const wx = W * 0.5 + toGoal * 130; K.rr(wx, wl - 20, 120, H, 0, '#f6f1e7'); K.rr(wx, wl + 20, 14, H, 0, '#2a79b8'); K.text('도착!', wx + 60, wl + 90, 34, '#d84b2a'); }
  // 헤엄치는 아이: 새로 만든 자유형 그림(팔 위치 두 가지)을 번갈아 보여줘요
  const sx = W * 0.4, sy = wl + 92 + Math.sin(wob) * 5, a = stroke, ph = 'swim_' + (1 + ((Math.floor(swimF) % 4) + 4) % 4), sh = Math.min(H, W) * 0.34;
  swimF += (K.t - lastT) * (2.4 + 5 * Math.min(1, a || 0)); lastT = K.t;
  K.spr(ph, sx, sy + sh * 0.4, sh, { rot: Math.sin(wob) * 0.02, shadow: false, px: 0.5 });
  // 몸 아래쪽은 물 속에 잠겨 보여요
  const wg = c.createLinearGradient(0, sy - 8, 0, sy + sh * 0.5 + 20); wg.addColorStop(0, '#5fd0ee22'); wg.addColorStop(0.3, '#3fb2e277'); wg.addColorStop(1, '#1f8fc9ee'); c.fillStyle = wg; c.fillRect(0, sy - 8, W, H);
  c.strokeStyle = '#ffffffcc'; c.lineWidth = 4; c.beginPath(); for (let x = 0; x <= W; x += 12) c.lineTo(x, sy - 8 + Math.sin(x * 0.04 + K.t * 4) * 3); c.stroke();
  c.fillStyle = '#ffffffaa'; c.fillRect(0, wl - 3, W, 6); // 수면선
  // 물보라
  for (const p of splash) { p.l -= 1 / 60; p.x += p.vx / 60; p.y += p.vy / 60; p.vy += 8; K.circle(sx + sh * 0.9 + p.x, sy - 10 + p.y, 6, '#fff'); } splash = splash.filter((p) => p.l > 0);
  // 박자 신호
  const p = beatT / BEAT, rr = 36; K.ring(W * 0.4 + 60, wl - 90, rr, 1 - p, p > 1 - WIN / BEAT * 1.2 || p < WIN / BEAT * 0.6 ? '#25b455' : '#ff7a2f');
}
K.start('🏊 수영', '둥근 신호가 작아져서 딱 맞을 때<br>큰 버튼을 눌러요. 늦어도 괜찮아요!', reset);
K.run(update, draw);
</script></body></html>
